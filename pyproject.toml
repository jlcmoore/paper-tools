[build-system]
requires = ["uv_build>=0.10.3,<0.11"]
build-backend = "uv_build"

[project]
name = "paper-tools"
version = "0.1.0"
description = "Extract abstracts and build validated arXiv source archives."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["arxiv-latex-cleaner==1.0.8"]

[project.scripts]
paper-tools = "paper_tools.cli:main"

[dependency-groups]
dev = [
    "pylint==3.3.1",
    "ruff==0.14.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["paper_tools", "tools"]

[tool.pylint.main]
py-version = "3.9"
source-roots = ["src", "."]

[tool.pylint.format]
max-line-length = 88
